; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; PlatformIO Project Configuration File

[platformio]
default_envs = esp12e ; Default target environment when clicking compile/upload

; --- ENVIRONMENT 1: THE ORIGINAL CLOCK (4MB FLASH) ---
[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
upload_speed = 460800
lib_deps =
    https://github.com/endy128/AyresWiFiManager.git
    bblanchon/ArduinoJson @ ^7.0.0

; --- ENVIRONMENT 2: THE NEW SPACE-CONSTRAINED CLOCK (1MB FLASH) ---
[env:esp12h]
platform = espressif8266
board = esp12e              ; Keeps all your GPIO 12, 13, 14 pin mappings intact!
framework = arduino
board_build.filesystem = littlefs
upload_speed = 460800

; --- 1MB MEMORY OVERRIDES ---
board_build.ldscript = eagle.flash.1m256.ld ; Splits into 768KB code + 256KB LittleFS storage
board_build.flash_mode = dout               ; Forces the 2-wire communication standard to prevent lockups

lib_deps =
    https://github.com/endy128/AyresWiFiManager.git
    bblanchon/ArduinoJson @ ^7.0.0
